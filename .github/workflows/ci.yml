name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Release gate (secrets, routes, SAST, SCA, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Release gate
        run: python -I tools/security_check.py

  docker:
    name: Container builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t eye-of-sauron:ci .
      - name: Start and check health
        run: |
          docker run -d --name eos -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e EOS_DISABLE_SCHEDULER=true eye-of-sauron:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 2; done
          docker logs eos; exit 1
